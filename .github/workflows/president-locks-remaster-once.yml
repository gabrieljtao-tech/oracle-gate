name: President Locks Fact-Checked Remaster Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/president-locks-remaster-once.yml

permissions:
  contents: write

concurrency:
  group: president-locks-factchecked-remaster-once
  cancel-in-progress: false

jobs:
  remaster:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VOICE_URL: https://cdn.muapi.ai/outputs/generated/14185a12b67b4f75adaf8f985fa5e259.mp3
      VOICE_SHA256: 1a243299f0482c3eeda20c2ed2633ef6b498beb94e682b5bc1e983f667b2a82c
      BED_URL: https://cdn.muapi.ai/outputs/generated/230a13b403e348f784f68650cd7e352b.mp3
      BED_SHA256: 800045aa69558975751a46926ce8c6b75a438b311a9801913ddf41220a2b8a23
      SIGNED_UPLOAD_ENDPOINT: https://veqpmdsiqcjjpxgcubrp.supabase.co/functions/v1/studio-signed-upload
      STORAGE_BUCKET: voice-vault
      STORAGE_PATH: president-notes/a7e3c4c2-locks-factchecked-remaster-v3.mp3
      OBJECTIVE_ID: ee2fbe20-ecce-4520-8712-7f100deea170
      NOTE_ID: a7e3c4c2-78ae-4396-9064-a3f29f5ef4c7
      MIX_JOB_ID: 35813882-31ae-44cf-8977-83b722df3851
      VOICE_PROFILE_REFERENCE_ID: "5500"
      VOICE_PROFILE_SHA256: 86c7db4dd9cfa663dd28d35bef375842af9da56f539c47a0b1d4f4196b96a3b8
      VOICE_PROVIDER: muapi_minimax
      VOICE_MODEL: minimax-speech-2.6-hd
      VOICE_ID: GabePresRawEight
      VOICE_SPEED: "1.06"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify execution tools
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -version | head -1
          ffprobe -version | head -1
          python3 --version
          curl --version | head -1
          mkdir -p .gabs-remaster proofs

      - name: Download and hash-bind exact approved sources
        shell: bash
        run: |
          set -euo pipefail
          cd .gabs-remaster
          curl --fail --location --retry 4 --retry-all-errors --silent --show-error -o voice.mp3 "$VOICE_URL"
          curl --fail --location --retry 4 --retry-all-errors --silent --show-error -o bed.mp3 "$BED_URL"
          printf '%s  voice.mp3\n' "$VOICE_SHA256" | sha256sum --check --strict
          printf '%s  bed.mp3\n' "$BED_SHA256" | sha256sum --check --strict
          ffprobe -v error -show_entries stream=codec_name,channels,sample_rate,bit_rate -show_entries format=duration,size -of json voice.mp3 > voice-source-probe.json
          ffprobe -v error -show_entries stream=codec_name,channels,sample_rate,bit_rate -show_entries format=duration,size -of json bed.mp3 > bed-source-probe.json

      - name: Build exact voice stem and three-section evolving music stem
        shell: bash
        run: |
          set -euo pipefail
          cd .gabs-remaster
          VOICE_DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 voice.mp3)
          python3 - "$VOICE_DUR" <<'PY'
          import sys
          v=float(sys.argv[1])
          intro=4.0
          outro=4.0
          total=intro+v+outro
          b1=intro+34.0
          b2=intro+95.0
          l1=b1+2.0
          l2=b2-b1+4.0
          l3=total-b2+2.0
          vals={
            'VOICE_DUR':v,'VOICE_END':intro+v,'TOTAL':total,
            'B1':b1,'B2':b2,'L1':l1,'L2':l2,'L3':l3,
            'FADE_OUT_START':total-3.0,
          }
          with open('timing.env','w') as f:
            for k,x in vals.items(): f.write(f'{k}={x:.6f}\n')
          PY
          source timing.env

          ffmpeg -hide_banner -loglevel warning -y -i voice.mp3 \
            -af "aresample=44100,aformat=sample_fmts=fltp:sample_rates=44100:channel_layouts=stereo,adelay=4000|4000,apad=whole_dur=$TOTAL,atrim=duration=$TOTAL" \
            -ar 44100 -ac 2 -c:a pcm_s16le voice-stem.wav

          ffmpeg -hide_banner -loglevel warning -y -stream_loop -1 -i bed.mp3 -t "$L1" \
            -af "aformat=sample_fmts=fltp:sample_rates=44100:channel_layouts=stereo,asetrate=43438,aresample=44100,highpass=f=55,lowpass=f=14500,equalizer=f=420:t=q:w=1:g=1.5" \
            -ar 44100 -ac 2 -c:a pcm_s16le bed-section-1.wav
          ffmpeg -hide_banner -loglevel warning -y -stream_loop -1 -i bed.mp3 -t "$L2" \
            -af "aformat=sample_fmts=fltp:sample_rates=44100:channel_layouts=stereo,asetrate=44541,aresample=44100,highpass=f=65,lowpass=f=11800,equalizer=f=180:t=q:w=1:g=2.5,aecho=0.8:0.65:43:0.08" \
            -ar 44100 -ac 2 -c:a pcm_s16le bed-section-2.wav
          ffmpeg -hide_banner -loglevel warning -y -stream_loop -1 -i bed.mp3 -t "$L3" \
            -af "aformat=sample_fmts=fltp:sample_rates=44100:channel_layouts=stereo,asetrate=43880,aresample=44100,highpass=f=50,lowpass=f=15000,equalizer=f=1800:t=q:w=1.2:g=1.8,tremolo=f=0.18:d=0.08" \
            -ar 44100 -ac 2 -c:a pcm_s16le bed-section-3.wav

          ffmpeg -hide_banner -loglevel warning -y \
            -i bed-section-1.wav -i bed-section-2.wav -i bed-section-3.wav \
            -filter_complex "[0:a][1:a]acrossfade=d=4:c1=tri:c2=tri[s12];[s12][2:a]acrossfade=d=4:c1=tri:c2=tri[bedraw]" \
            -map '[bedraw]' -t "$TOTAL" -ar 44100 -ac 2 -c:a pcm_s16le bed-evolved-raw.wav

          python3 - <<'PY'
          vals={}
          for line in open('timing.env'):
              k,v=line.strip().split('=',1); vals[k]=float(v)
          b1,b2,ve,fo=vals['B1'],vals['B2'],vals['VOICE_END'],vals['FADE_OUT_START']
          intro=0.7079457844
          g1=0.3311311215
          g2=0.2884031503
          g3=0.3630780548
          expr=(
            f"if(lt(t,4),{intro},"
            f"if(lt(t,5),{intro}+({g1}-{intro})*(t-4),"
            f"if(lt(t,{b1-2}),{g1},"
            f"if(lt(t,{b1+2}),{g1}+({g2}-{g1})*(t-({b1-2}))/4,"
            f"if(lt(t,{b2-2}),{g2},"
            f"if(lt(t,{b2+2}),{g2}+({g3}-{g2})*(t-({b2-2}))/4,"
            f"if(lt(t,{ve}),{g3},"
            f"if(lt(t,{ve+1}),{g3}+({intro}-{g3})*(t-{ve}),{intro}))))))))"
          )
          open('bed-gain-filter.txt','w').write(
            f"volume='{expr}':eval=frame,afade=t=out:st={fo}:d=3"
          )
          PY
          BED_FILTER=$(cat bed-gain-filter.txt)
          ffmpeg -hide_banner -loglevel warning -y -i bed-evolved-raw.wav \
            -af "$BED_FILTER" -t "$TOTAL" -ar 44100 -ac 2 -c:a pcm_s16le bed-stem.wav

          ffprobe -v error -show_entries stream=codec_name,channels,sample_rate,bits_per_sample -show_entries format=duration,size -of json voice-stem.wav > voice-stem-probe.json
          ffprobe -v error -show_entries stream=codec_name,channels,sample_rate,bits_per_sample -show_entries format=duration,size -of json bed-stem.wav > bed-stem-probe.json

      - name: Mix, reconstruct, encode, and bind exact artifact
        shell: bash
        run: |
          set -euo pipefail
          cd .gabs-remaster
          source timing.env
          MIX_FILTER='[0:a][1:a]amix=inputs=2:duration=longest:dropout_transition=0:normalize=0,alimiter=limit=0.89:attack=5:release=60:latency=1[out]'
          printf '%s\n' "$MIX_FILTER" > mix-filter.txt

          ffmpeg -hide_banner -loglevel warning -y -i voice-stem.wav -i bed-stem.wav \
            -filter_complex "$MIX_FILTER" -map '[out]' -t "$TOTAL" -ar 44100 -ac 2 -c:a pcm_s16le mix.wav
          ffmpeg -hide_banner -loglevel warning -y -i voice-stem.wav -i bed-stem.wav \
            -filter_complex "$MIX_FILTER" -map '[out]' -t "$TOTAL" -ar 44100 -ac 2 -c:a pcm_s16le mix-reconstructed.wav

          MIX_SHA=$(sha256sum mix.wav | awk '{print $1}')
          RECON_SHA=$(sha256sum mix-reconstructed.wav | awk '{print $1}')
          test "$MIX_SHA" = "$RECON_SHA"

          ffmpeg -hide_banner -loglevel warning -y -i mix.wav -map_metadata -1 \
            -ar 44100 -ac 2 -c:a libmp3lame -b:a 192k -write_xing 1 -id3v2_version 0 master.mp3
          ffmpeg -hide_banner -loglevel warning -y -i master.mp3 -map_metadata -1 \
            -ar 44100 -ac 2 -c:a pcm_s16le master-decoded.wav

          cat > reconstruction-recipe.json <<EOF
          {
            "schema":"gabs.president_ffmpeg_reconstruction_recipe.v1",
            "voice_source_sha256":"$VOICE_SHA256",
            "bed_source_sha256":"$BED_SHA256",
            "sample_rate":44100,
            "channels":2,
            "voice_delay_seconds":4,
            "section_boundaries_seconds":[38,99],
            "crossfade_seconds":4,
            "section_pitch_sample_rates":[43438,44541,43880],
            "under_voice_gain_db":[-9.6,-10.8,-8.8],
            "intro_gain_db":-3,
            "outro_gain_db":-3,
            "limiter_peak":0.89,
            "master_codec":"libmp3lame",
            "master_bitrate":192000,
            "mix_filter":"$MIX_FILTER"
          }
          EOF

          sha256sum voice-stem.wav > voice-stem.sha256
          sha256sum bed-stem.wav > bed-stem.sha256
          sha256sum mix.wav > mix.sha256
          sha256sum master.mp3 > master.sha256
          sha256sum reconstruction-recipe.json > recipe.sha256
          stat -c '%s' master.mp3 > master.bytes

          ffprobe -v error -show_entries stream=codec_name,channels,sample_rate,bit_rate -show_entries format=duration,size -of json mix.wav > mix-probe.json
          ffprobe -v error -show_entries stream=codec_name,channels,sample_rate,bit_rate -show_entries format=duration,size -of json master.mp3 > master-probe.json

          python3 - <<'PY'
          import json, math, wave
          from array import array
          def mono_samples(path):
              with wave.open(path,'rb') as w:
                  if w.getsampwidth()!=2: raise SystemExit('pcm16_required')
                  ch=w.getnchannels(); sr=w.getframerate(); frames=w.getnframes()
                  raw=array('h'); raw.frombytes(w.readframes(frames))
                  if ch==1: vals=[float(x) for x in raw]
                  else: vals=[(raw[i]+raw[i+1])/2 for i in range(0,len(raw)-1,ch)]
                  return sr,vals
          sr_a,a=mono_samples('mix.wav')
          sr_b,b=mono_samples('master-decoded.wav')
          if sr_a!=sr_b: raise SystemExit('sample_rate_mismatch')
          n=min(len(a),len(b)); step=max(1,n//150000)
          aa=a[:n:step]; bb=b[:n:step]
          ma=sum(aa)/len(aa); mb=sum(bb)/len(bb)
          num=sum((x-ma)*(y-mb) for x,y in zip(aa,bb))
          da=math.sqrt(sum((x-ma)**2 for x in aa)); db=math.sqrt(sum((y-mb)**2 for y in bb))
          corr=num/(da*db) if da and db else 0.0
          duration_delta=abs(len(a)-len(b))/sr_a
          result={
            'waveform_correlation':corr,
            'duration_delta_seconds':duration_delta,
            'sample_rate':sr_a,
            'mix_frames':len(a),
            'decoded_master_frames':len(b),
            'master_mix_binding_pass':corr>=0.94 and duration_delta<=0.2,
          }
          open('master-binding.json','w').write(json.dumps(result,indent=2,sort_keys=True)+'\n')
          if not result['master_mix_binding_pass']:
              raise SystemExit(f'master binding failed: {result}')
          PY

      - name: Measure phone audibility, speech balance, and silence continuity
        shell: bash
        run: |
          set -euo pipefail
          cd .gabs-remaster
          measure_db() {
            local file="$1" start="$2" dur="$3" filter="$4"
            ffmpeg -hide_banner -nostats -ss "$start" -t "$dur" -i "$file" \
              -af "$filter,volumedetect" -f null - 2>&1 \
              | sed -n 's/.*mean_volume: \([-0-9.]*\) dB.*/\1/p' | tail -1
          }
          VOICE_SPEECH_DB=$(measure_db voice-stem.wav 40 20 'highpass=f=300,lowpass=f=3400')
          BED_SPEECH_DB=$(measure_db bed-stem.wav 40 20 'highpass=f=300,lowpass=f=3400')
          VOICE_PHONE_DB=$(measure_db voice-stem.wav 40 20 'highpass=f=250,lowpass=f=2000')
          BED_PHONE_DB=$(measure_db bed-stem.wav 40 20 'highpass=f=250,lowpass=f=2000')
          INTRO_MUSIC_DB=$(measure_db bed-stem.wav 0.25 3 'highpass=f=90,lowpass=f=5000')
          ffmpeg -hide_banner -nostats -i mix.wav -af silencedetect=n=-45dB:d=0.5 -f null - 2> silence.log || true
          SILENCE_GAPS=$(grep -c 'silence_start' silence.log || true)

          python3 - "$VOICE_SPEECH_DB" "$BED_SPEECH_DB" "$VOICE_PHONE_DB" "$BED_PHONE_DB" "$INTRO_MUSIC_DB" "$SILENCE_GAPS" <<'PY'
          import json,sys
          vs,bs,vp,bp,intro=map(float,sys.argv[1:6]); gaps=int(sys.argv[6])
          speech=vs-bs; phone=vp-bp
          result={
            'voice_speech_band_db':vs,
            'bed_speech_band_db':bs,
            'voice_to_bed_speech_band_db':speech,
            'voice_phone_band_db':vp,
            'bed_phone_band_db':bp,
            'phone_music_voice_to_music_band_db':phone,
            'intro_music_band_db':intro,
            'silence_gap_count_below_45db_500ms':gaps,
            'speech_balance_pass':10.0 <= speech <= 17.5,
            'phone_audibility_pass':6.0 <= phone <= 18.0,
            'intro_audibility_machine_pass':intro >= -35.0,
            'zero_silence_gaps':gaps == 0,
          }
          result['machine_gate_ok']=all([
            result['speech_balance_pass'],result['phone_audibility_pass'],
            result['intro_audibility_machine_pass'],result['zero_silence_gaps']
          ])
          open('measurements.json','w').write(json.dumps(result,indent=2,sort_keys=True)+'\n')
          if not result['machine_gate_ok']:
              raise SystemExit(f'machine gate failed: {result}')
          PY

      - name: Obtain one-path signed URL and upload private master
        shell: bash
        run: |
          set -euo pipefail
          cd .gabs-remaster
          curl --fail --silent --show-error \
            -H 'content-type: application/json' \
            --data "{\"bucket\":\"$STORAGE_BUCKET\",\"path\":\"$STORAGE_PATH\"}" \
            "$SIGNED_UPLOAD_ENDPOINT" > signed-upload.json
          python3 - <<'PY'
          import json
          d=json.load(open('signed-upload.json'))
          if not d.get('ok') or not d.get('full_signed_url') or d.get('path') != 'president-notes/a7e3c4c2-locks-factchecked-remaster-v3.mp3':
              raise SystemExit('signed upload contract failed')
          open('signed-url.txt','w').write(d['full_signed_url'])
          PY
          SIGNED_URL=$(cat signed-url.txt)
          HTTP_STATUS=$(curl --silent --show-error --output upload-response.json --write-out '%{http_code}' \
            --request PUT --header 'content-type: audio/mpeg' --upload-file master.mp3 "$SIGNED_URL" || true)
          printf '%s\n' "$HTTP_STATUS" > upload-http-status.txt
          if [[ ! "$HTTP_STATUS" =~ ^2 ]]; then
            echo "signed upload failed with HTTP $HTTP_STATUS" >&2
            cat upload-response.json >&2 || true
            exit 1
          fi
          rm -f signed-upload.json signed-url.txt

      - name: Write proof manifest
        shell: bash
        run: |
          set -euo pipefail
          cd .gabs-remaster
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          def load(name): return json.load(open(name))
          def sha(name): return Path(name).read_text().split()[0]
          result={
            'ok': True,
            'schema':'gabs.president_oracle_gate_remaster.v1',
            'objective_id':os.environ['OBJECTIVE_ID'],
            'note_id':os.environ['NOTE_ID'],
            'mix_job_id':os.environ['MIX_JOB_ID'],
            'github_run_id':os.environ['GITHUB_RUN_ID'],
            'github_run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'github_sha':os.environ['GITHUB_SHA'],
            'ffmpeg_version':subprocess.check_output(['ffmpeg','-version'],text=True).splitlines()[0],
            'voice_source_sha256':os.environ['VOICE_SHA256'],
            'bed_source_sha256':os.environ['BED_SHA256'],
            'voice_stem_sha256':sha('voice-stem.sha256'),
            'bed_stem_sha256':sha('bed-stem.sha256'),
            'mix_wav_sha256':sha('mix.sha256'),
            'master_sha256':sha('master.sha256'),
            'reconstruction_recipe_sha256':sha('recipe.sha256'),
            'master_bytes':int(Path('master.bytes').read_text()),
            'storage_bucket':os.environ['STORAGE_BUCKET'],
            'storage_path':os.environ['STORAGE_PATH'],
            'signed_upload_http_status':int(Path('upload-http-status.txt').read_text()),
            'voice_profile_reference_id':os.environ['VOICE_PROFILE_REFERENCE_ID'],
            'voice_profile_sha256':os.environ['VOICE_PROFILE_SHA256'],
            'voice_provider':os.environ['VOICE_PROVIDER'],
            'voice_model':os.environ['VOICE_MODEL'],
            'voice_id':os.environ['VOICE_ID'],
            'voice_speed':float(os.environ['VOICE_SPEED']),
            'voice_source_probe':load('voice-source-probe.json'),
            'bed_source_probe':load('bed-source-probe.json'),
            'voice_stem_probe':load('voice-stem-probe.json'),
            'bed_stem_probe':load('bed-stem-probe.json'),
            'mix_probe':load('mix-probe.json'),
            'master_probe':load('master-probe.json'),
            'master_binding':load('master-binding.json'),
            'measurements':load('measurements.json'),
            'mix_reconstruction_pass': True,
            'master_mix_binding_pass':load('master-binding.json')['master_mix_binding_pass'],
            'provider_generation_skipped': True,
            'new_voice_generated': False,
            'new_music_generated': False,
            'spotify_audio_used': False,
            'text_changed': False,
            'voice_tempo_changed': False,
            'voice_pitch_changed': False,
            'intro_seconds':4.0,
            'outro_seconds':4.0,
            'section_arc':['curious_builder','trust_break_repair','high_energy_release'],
            'section_crossfade_seconds':4.0,
            'independent_full_artifact_review_required':True,
            'note_updated':False,
            'sms_released':False,
          }
          Path('../proofs/president-locks-remaster-result.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          Path('../proofs/president-locks-remaster-measurements.json').write_text(json.dumps(result['measurements'],indent=2,sort_keys=True)+'\n')
          Path('../proofs/president-locks-remaster-binding.json').write_text(json.dumps(result['master_binding'],indent=2,sort_keys=True)+'\n')
          PY
          cp master-probe.json ../proofs/president-locks-remaster-probe.json
          cp reconstruction-recipe.json ../proofs/president-locks-remaster-recipe.json

      - name: Upload short-lived workflow evidence
        uses: actions/upload-artifact@v4
        with:
          name: president-locks-remaster-evidence
          path: |
            proofs/president-locks-remaster-result.json
            proofs/president-locks-remaster-measurements.json
            proofs/president-locks-remaster-binding.json
            proofs/president-locks-remaster-probe.json
            proofs/president-locks-remaster-recipe.json
            .gabs-remaster/master.mp3
          retention-days: 1

      - name: Commit proof and remove one-use workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gabs-autonomous-loop'
          git config user.email 'gabs-autonomous-loop@users.noreply.github.com'
          git add proofs/president-locks-remaster-result.json \
                  proofs/president-locks-remaster-measurements.json \
                  proofs/president-locks-remaster-binding.json \
                  proofs/president-locks-remaster-probe.json \
                  proofs/president-locks-remaster-recipe.json
          git rm .github/workflows/president-locks-remaster-once.yml
          git commit -m 'proof: record and retire one-use President Note remaster'
          git push origin HEAD:main

name: Model Mesh Status Probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch bounded status probe
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 25 \
            'https://veqpmdsiqcjjpxgcubrp.supabase.co/functions/v1/gabs-model-mesh-status-probe' \
            -o mm-status.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('mm-status.json')
          raw = p.read_bytes()
          data = json.loads(raw)
          if not isinstance(data, dict):
              raise SystemExit('status probe must return a JSON object')
          print(json.dumps(data, sort_keys=True, separators=(',', ':')))
          print('sha256=' + hashlib.sha256(raw).hexdigest())
          PY
      - name: Preserve verifier artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-mesh-status-probe
          path: mm-status.json
          if-no-files-found: error
          retention-days: 1

name: President Locks Fact-Checked Remaster Once v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/president-locks-remaster-once-v2.yml

permissions:
  contents: write

concurrency:
  group: president-locks-factchecked-remaster-once-v2
  cancel-in-progress: false

jobs:
  remaster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install and verify FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version > ffmpeg-version.txt
          ffprobe -version > ffprobe-version.txt
          sed -n '1p' ffmpeg-version.txt
          sed -n '1p' ffprobe-version.txt
          python3 --version
          curl --version | sed -n '1p'

      - name: Execute calibrated exact-byte remaster and private upload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.gabs/president-locks-remaster-once.sh')
          s=p.read_text()
          replacements={
            'g1=0.3311311215':'g1=0.2483133105',
            'g2=0.2884031503':'g2=0.2162718524',
            'g3=0.3630780548':'g3=0.2722701308',
            '"under_voice_gain_db":[-9.6,-10.8,-8.8]':'"under_voice_gain_db":[-12.1,-13.3,-11.3]',
          }
          for old,new in replacements.items():
            if old not in s:
              raise SystemExit(f'missing calibration token: {old}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          chmod +x .gabs/president-locks-remaster-once.sh
          set +e
          .gabs/president-locks-remaster-once.sh > remaster-run.log 2>&1
          CODE=$?
          set -e
          cat remaster-run.log
          exit "$CODE"

      - name: Upload safe diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: president-locks-remaster-diagnostics-v3
          path: |
            remaster-run.log
            proofs/president-locks-remaster-result.json
            proofs/president-locks-remaster-measurements.json
            proofs/president-locks-remaster-binding.json
            proofs/president-locks-remaster-probe.json
            proofs/president-locks-remaster-recipe.json
            .gabs-remaster/voice-source-probe.json
            .gabs-remaster/bed-source-probe.json
            .gabs-remaster/voice-stem-probe.json
            .gabs-remaster/bed-stem-probe.json
            .gabs-remaster/mix-probe.json
            .gabs-remaster/master-probe.json
            .gabs-remaster/master-binding.json
            .gabs-remaster/measurements.json
            .gabs-remaster/silence.log
            .gabs-remaster/timing.env
            .gabs-remaster/bed-gain-filter.txt
            .gabs-remaster/reconstruction-recipe.json
            .gabs-remaster/upload-http-status.txt
            .gabs-remaster/upload-response.json
            .gabs-remaster/master.mp3
          if-no-files-found: warn
          retention-days: 1

      - name: Commit proof and remove one-use execution surface
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gabs-autonomous-loop'
          git config user.email 'gabs-autonomous-loop@users.noreply.github.com'
          git add proofs/president-locks-remaster-result.json \
                  proofs/president-locks-remaster-measurements.json \
                  proofs/president-locks-remaster-binding.json \
                  proofs/president-locks-remaster-probe.json \
                  proofs/president-locks-remaster-recipe.json
          git rm .github/workflows/president-locks-remaster-once-v2.yml \
                 .gabs/president-locks-remaster-once.sh
          git commit -m 'proof: record and retire one-use President Note remaster v2'
          git push origin HEAD:main

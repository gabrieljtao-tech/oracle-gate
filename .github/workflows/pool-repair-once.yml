name: Pool Repair Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect and pause proven cron hotspots
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://veqpmdsiqcjjpxgcubrp.supabase.co/functions/v1/gabs-pool-recovery'
          nonce='YvKHqBdeU8nOgPFO2a6Hi5kV4vP1T3DT'
          curl --fail --silent --show-error --max-time 90 -X POST "$endpoint" \
            -H 'content-type: application/json' \
            --data "{\"action\":\"inspect\",\"nonce\":\"$nonce\"}" \
            -o inspect.json
          cat inspect.json
          python - <<'PY'
          import json
          data=json.load(open('inspect.json'))
          assert data.get('ok') is True, data
          rows=data.get('before',[])
          assert all(('gabs_scanners_to_findings' in r.get('command','') or 'gabs_weasel_find_disconnected_pipes' in r.get('command','')) for r in rows), rows
          print('target_count='+str(len(rows)))
          print('active_count='+str(sum(bool(r.get('active')) for r in rows)))
          PY
          curl --fail --silent --show-error --max-time 90 -X POST "$endpoint" \
            -H 'content-type: application/json' \
            --data "{\"action\":\"pause_hot_crons\",\"nonce\":\"$nonce\"}" \
            -o repair.json
          cat repair.json
          python - <<'PY'
          import json
          data=json.load(open('repair.json'))
          assert data.get('ok') is True, data
          assert all(r.get('active') is False for r in data.get('after',[])), data
          print('changed_count='+str(len(data.get('changed',[]))))
          print('verified_inactive=true')
          PY

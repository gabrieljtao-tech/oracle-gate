name: Direct Postgres Readiness

on:
  push:
    branches: [orca/pool-recovery-probe-20260719]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call bounded readiness endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 60 \
            'https://veqpmdsiqcjjpxgcubrp.supabase.co/functions/v1/gabs-pool-recovery' \
            -o readiness.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          raw = Path('readiness.json').read_bytes()
          data = json.loads(raw)
          print(json.dumps(data, sort_keys=True, separators=(',', ':')))
          print('sha256=' + hashlib.sha256(raw).hexdigest())
          if data.get('ok') is not True or data.get('direct_postgres') is not True:
              raise SystemExit('direct postgres readiness failed')
          PY
      # one-shot branch probe; remove after collection
